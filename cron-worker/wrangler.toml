name = "mrsabpata-cron"
main = "src/index.ts"
compatibility_date = "2026-05-19"

# 2026-06-10: dropped from twice-a-day to once-a-day at 16:00 Stockholm.
# 14:00 UTC = 16:00 Stockholm in summer (CEST / UTC+2).
# DST NOTE: when Stockholm switches back to CET in late October, change this
# to "0 15 * * *" (CET / UTC+1) to keep the post at 16:00 local. Cron is
# always evaluated in UTC; Cloudflare doesn't auto-DST.
[triggers]
crons = ["0 14 * * *"]

[vars]
REPO_OWNER = "mimran08"
REPO_NAME = "mrsabpata-social"
