name: Evening Post Mac (6pm Stockholm)

# Runs on the self-hosted Mac runner so X (browser) doesn't hang the way it does
# in CI WebKit + Xvfb. No schedule trigger — the Cloudflare Worker dispatches this.

on:
  workflow_dispatch:

jobs:
  post:
    name: Post to all platforms (Mac)
    runs-on: [self-hosted, macOS, mrsabpata]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Don't run `git clean -ffdx` between runs — preserves gitignored
          # files like company/*-cookies.json, the rendered videos cache, and
          # the local Pixabay-bg pool. The previous approach injected cookies
          # from base64-gzipped GH secrets every run (legacy; secrets went
          # stale within days). Now: refresh cookies locally via
          # scripts/extract-cookies.py whenever they expire — the workspace
          # carries them forward.
          clean: false

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers (only if missing)
        timeout-minutes: 5
        run: |
          # 2026-06-13: this step hung for 30 min and ate the whole job. The
          # self-hosted Mac runner already has webkit + chromium installed
          # from prior runs (they live in ~/Library/Caches/ms-playwright/).
          # Check first; only download if a target browser dir is missing.
          # Hard 5-min timeout so even a partial download can't burn the run.
          set -e
          CACHE_DIR="$HOME/Library/Caches/ms-playwright"
          NEED_INSTALL=0
          if [ ! -d "$CACHE_DIR" ]; then NEED_INSTALL=1; fi
          if [ ! "$(ls -d "$CACHE_DIR"/chromium-* 2>/dev/null | head -1)" ]; then NEED_INSTALL=1; fi
          if [ ! "$(ls -d "$CACHE_DIR"/webkit-* 2>/dev/null | head -1)" ]; then NEED_INSTALL=1; fi
          if [ "$NEED_INSTALL" -eq 1 ]; then
            echo "Browser binaries missing — installing"
            npx playwright install webkit chromium
          else
            echo "Browser binaries already present, skipping install"
            ls "$CACHE_DIR" | head
          fi

      # (Removed 'Restore platform sessions' step that decoded base64-gzipped
      # cookie secrets — they were the GH-cloud-runner approach and went stale
      # within days. On the self-hosted Mac runner the cookies persist in the
      # workspace from prior runs, and we refresh them locally from Safari via
      # scripts/extract-cookies.py whenever needed.)

      - name: Set today's date
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore done-state cache (prevents duplicate posts on re-run)
        id: done-cache
        uses: actions/cache/restore@v4
        with:
          path: company/daily-posts
          key: done-state-evening-mac-${{ steps.date.outputs.today }}-${{ github.run_number }}
          restore-keys: done-state-evening-mac-${{ steps.date.outputs.today }}-

      - name: Create .env.local
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Pixabay Images API — fallback scene backgrounds when Gemini comic
          # panel generation can't run (no key, quota, or posts.panels empty).
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          # Gemini API — used by utils/comic-panels.ts (nano-banana) to render
          # story-mode comic panels with the recurring cast (Ahmed/Fatima/Bilal).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          TIMEZONE: Europe/Stockholm
          CHANNEL_NAME: MrSabPata
          OWNER_NAME: Imran
        run: |
          python3 - << 'PYEOF'
          import os
          keys = [
            'GROQ_API_KEY','PIXABAY_API_KEY','GEMINI_API_KEY',
            'YOUTUBE_API_KEY','YOUTUBE_CHANNEL_ID',
            'YOUTUBE_CLIENT_ID','YOUTUBE_CLIENT_SECRET','YOUTUBE_REFRESH_TOKEN',
            'X_API_KEY','X_API_SECRET','X_ACCESS_TOKEN','X_ACCESS_TOKEN_SECRET','X_BEARER_TOKEN',
            'TIKTOK_CLIENT_KEY','TIKTOK_CLIENT_SECRET','TIKTOK_ACCESS_TOKEN',
            'INSTAGRAM_ACCESS_TOKEN','INSTAGRAM_BUSINESS_ACCOUNT_ID',
            'TIMEZONE','CHANNEL_NAME','OWNER_NAME',
          ]
          with open('.env.local', 'w') as f:
            for k in keys:
              v = os.environ.get(k, '')
              if v:
                f.write(f'{k}={v}\n')
          print(f"Wrote {len(keys)} vars to .env.local")
          PYEOF

      - name: Create output directories
        run: mkdir -p company/daily-posts company/post-images company/post-videos logs

      - name: Run evening post
        env:
          # Persistent state dir (out of repo) — survives `git checkout` between cron
          # runs so news-dedup state actually accumulates across days
          MRSABPATA_STATE_DIR: /Users/imran/.mrsabpata-state
          # Long video mode: 60s structured renderer (hook → points → stat → cta).
          # Unset (or set to anything other than "1") to fall back to the 20s renderer.
          LONG_VIDEO: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Pixabay Images API — fallback scene backgrounds when Gemini can't run.
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          # Gemini — nano-banana comic panel rendering for story-mode posts.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: npx tsx --env-file=.env.local index.ts "post evening"

      - name: Save done-state cache (always — survives failed runs)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: company/daily-posts
          key: done-state-evening-mac-${{ steps.date.outputs.today }}-${{ github.run_number }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evening-mac-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
